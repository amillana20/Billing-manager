# Visita la app cada 10 minutos para que Render (plan gratuito) no la duerma
# y Supabase no pause la base de datos por inactividad.
# Solo se ejecuta desde la rama por defecto (main).
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
               --retry 3 --retry-delay 20 --retry-all-errors \
               --max-time 90 \
               "${APP_URL}/health"
        env:
          APP_URL: https://billing-manager-s4w3.onrender.com
