<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Gestión de gastos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <style>
    :root {
      --bg: #0d0d0d; --surface: #161616; --border: #242424;
      --text: #e8e6e0; --muted: #666; --accent: #c8f135; --danger: #ff5c5c;
      --font-main: 'Syne', sans-serif; --font-mono: 'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font-main);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 360px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px;
    }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 24px; }
    .logo span { color: var(--accent); }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 9px; color: var(--text); font-family: var(--font-mono);
      font-size: 16px; padding: 12px; margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; background: var(--accent); border: none; border-radius: 9px;
      color: #0d0d0d; cursor: pointer; font-family: var(--font-main);
      font-size: 14px; font-weight: 600; padding: 12px; margin-top: 4px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 12px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="logo">EXPENSES MANAGER <span>(by amillana)</span></div>
    <label for="usuario">Usuario</label>
    <input id="usuario" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Entrar</button>
    <div class="error" id="error"></div>
  </form>

  <script>
    const form  = document.getElementById("form");
    const btn   = document.getElementById("btn");
    const error = document.getElementById("error");

    form.addEventListener("submit", async e => {
      e.preventDefault();
      btn.disabled = true;
      error.textContent = "";
      try {
        const res = await fetch("/login", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            usuario:  document.getElementById("usuario").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        if (res.ok) {
          location.href = "/";
          return;
        }
        const data = await res.json().catch(() => ({}));
        error.textContent = typeof data.detail === "string"
          ? data.detail
          : "No se ha podido iniciar sesión.";
      } catch {
        error.textContent = "Sin conexión con el servidor.";
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
