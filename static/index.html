<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!--
    viewport es crucial para móvil: sin esta línea el navegador
    del móvil renderiza la página como si fuera escritorio y la encoge.
    width=device-width usa el ancho real del móvil.
    initial-scale=1 evita zoom automático.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de gastos (by amillana)</title>

  <!-- Google Fonts: cargamos dos fuentes externas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

    <!-- Vincula el manifest -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- Color de la barra de estado en móvil -->
    <meta name="theme-color" content="#0d0d0d">

    <!-- Para iOS, que no soporta manifest directamente -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">

  <style>
    /* ── Variables CSS ────────────────────────────────────────────────
       Las variables CSS (--nombre) permiten definir valores una vez
       y reutilizarlos en todo el fichero. Si quieres cambiar el color
       de acento solo tocas una línea.
    ──────────────────────────────────────────────────────────────── */
    :root {
      --bg:        #0d0d0d;
      --surface:   #161616;
      --border:    #242424;
      --text:      #e8e6e0;
      --muted:     #666;
      --accent:    #c8f135;   /* verde lima como color de acento */
      --danger:    #ff5c5c;
      --good:      #6fd99a;   /* verde para "gastas menos" */
      --radius:    12px;
      --font-main: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    /* ── Reset básico ─────────────────────────────────────────────────
       Los navegadores tienen estilos por defecto distintos entre sí.
       Este reset los elimina para partir de una base común.
    ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      /* padding-bottom deja espacio para la barra de navegación
         inferior del móvil */
      padding-bottom: 80px;
    }


    /* ── Header ───────────────────────────────────────────────────────
       position: sticky + top: 0 hace que el header se quede fijo
       en la parte superior al hacer scroll.
    ──────────────────────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 20px 20px 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }

    .btn-salir {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 12px;
      padding: 5px 10px;
    }

    .btn-salir:hover { border-color: var(--danger); color: var(--danger); }

    /* El punto verde del logo */
    .logo span {
      color: var(--accent);
    }

    /* ── Píldoras de resumen ──────────────────────────────────────────
       display: flex + overflow-x: auto permite que las píldoras
       hagan scroll horizontal en móvil si no caben todas.
    ──────────────────────────────────────────────────────────────── */
    .stats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      /* Oculta la barra de scroll horizontal en la mayoría de navegadores */
      scrollbar-width: none;
    }
    .stats::-webkit-scrollbar { display: none; }

    .stat {
      flex-shrink: 0;   /* evita que las píldoras se encojan */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 110px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 400;
    }

    .stat-value.accent { color: var(--accent); }

    /* ── Tabs ─────────────────────────────────────────────────────────
       Las pestañas permiten navegar entre vistas sin recargar.
    ──────────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      background: var(--bg);
    }

    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 13px;
      padding: 12px 16px;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Contenido principal ─────────────────────────────────────────
       max-width + margin: auto centra el contenido en escritorio.
       En móvil ocupa todo el ancho.
    ──────────────────────────────────────────────────────────────── */
    .content {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── Vista (pestaña) ──────────────────────────────────────────────
       Por defecto todas las vistas están ocultas.
       La clase .active las muestra.
    ──────────────────────────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Lista de gastos ─────────────────────────────────────────────*/
    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .expense-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      /* transition anima cambios de estilo suavemente */
      transition: border-color 0.15s;
    }

    .expense-item:hover { border-color: #333; }

    .expense-icon {
      font-size: 22px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border-radius: 10px;
      flex-shrink: 0;
    }

    .expense-body { flex: 1; min-width: 0; }

    .expense-desc {
      font-size: 14px;
      /* Trunca el texto con ... si es demasiado largo */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expense-meta {
      display: flex;
      gap: 8px;
      margin-top: 3px;
    }

    .expense-cat {
      font-size: 11px;
      color: var(--muted);
    }

    .expense-date {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #444;
    }

    .expense-amount {
      font-family: var(--font-mono);
      font-size: 15px;
      flex-shrink: 0;
    }

    .expense-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #444;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.15s;
    }
    .icon-btn:hover { color: var(--text); }
    .icon-btn.del:hover { color: var(--danger); }

    /* ── Estado vacío ────────────────────────────────────────────────*/
    .empty {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }

    /* ── Gráfico de categorías ────────────────────────────────────────
       Un gráfico de barras construido solo con HTML y CSS,
       sin ninguna librería externa.
    ──────────────────────────────────────────────────────────────── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
    }

    .chart-title {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .bar-label {
      font-size: 12px;
      width: 110px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      background: var(--bg);
      border-radius: 4px;
      height: 8px;
      position: relative;   /* para colocar la marca del mes anterior */
    }

    /* La anchura de .bar-fill se controla desde JavaScript
       con elemento.style.width = "60%" */
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      /* transition anima el cambio de ancho suavemente */
      transition: width 0.4s ease;
    }

    .bar-value {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      width: 78px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Comparación con el mes anterior ──────────────────────────────
       Rojo = gastas más que el mes anterior, verde = gastas menos.
    ──────────────────────────────────────────────────────────────── */
    .up   { color: var(--danger); }
    .down { color: var(--good); }
    .flat { color: var(--muted); }

    .stat-delta {
      font-family: var(--font-mono);
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
    }

    /* Rayita que marca lo gastado el mes anterior en cada categoría */
    .bar-prev {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 2px;
      background: var(--text);
      opacity: 0.55;
      border-radius: 1px;
      transition: left 0.4s ease;
    }

    .bar-delta { font-size: 10px; margin-top: 2px; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
    }
    .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
    .legend .l-fill { width: 14px; height: 6px; background: var(--accent); border-radius: 3px; }
    .legend .l-prev { width: 2px; height: 12px; background: var(--text); opacity: 0.55; }

    /* ── Evolución mensual ────────────────────────────────────────── */
    /* Selector del número de meses (3m / 6m / 12m / 24m) */
    .seg {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .seg button {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .seg button:hover { color: var(--text); }
    .seg button.active { background: var(--accent); color: var(--bg); }

    .evo-resumen {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .evo-resumen > div { min-width: 0; }
    .evo-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .evo-valor {
      font-family: var(--font-mono);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    /* Gráfico de columnas: una por mes, la altura se pone desde JS */
    .cols {
      position: relative;
      height: 170px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .col {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
    }
    .col-bar {
      width: 100%;
      max-width: 38px;
      background: #2d2d2d;
      border-radius: 4px 4px 0 0;
      transition: height 0.4s ease;
    }
    .col.prev .col-bar { background: #4a4f3a; }
    .col.cur  .col-bar { background: var(--accent); }
    .col-val {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      transform: translateY(-4px);
    }
    .col.cur .col-val { color: var(--accent); }
    /* Con muchos meses solo se ven los importes del mes actual y el anterior */
    .cols.dense .col-val { display: none; }
    .cols.dense .col.cur .col-val,
    .cols.dense .col.prev .col-val { display: block; }

    .media-linea {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px dashed #555;
      pointer-events: none;
    }
    .col-labels { display: flex; gap: 6px; margin-top: 6px; }
    .col-labels div {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
    }
    .col-labels div.cur { color: var(--text); }
    /* Con 24 meses las columnas son estrechas: el texto puede salirse */
    .col-labels.dense div { overflow: visible; }

    /* Tabla de categorías del periodo */
    .tabla-wrap { overflow-x: auto; }
    .tabla-cat { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tabla-cat th {
      text-align: left;
      font-weight: 400;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: 8px;
    }
    .tabla-cat td { padding: 8px 0; border-top: 1px solid var(--border); }
    .tabla-cat .num {
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding-left: 8px;
    }
    .tabla-cat .spark { width: 70px; padding-left: 8px; padding-right: 4px; }
    .tabla-cat svg { display: block; width: 60px; height: 22px; }

    @media (max-width: 420px) {
      .evo-resumen { grid-template-columns: 1fr 1fr; }
      .evo-resumen > div:last-child { grid-column: span 2; }
      .bar-label { width: 92px; }
    }

    /* ── Modal (formulario de añadir/editar) ─────────────────────────
       position: fixed cubre toda la pantalla por encima del contenido.
       El fondo semitransparente (overlay) oscurece lo de detrás.
    ──────────────────────────────────────────────────────────────── */
    .overlay {
      display: none;        /* oculto por defecto */
      position: fixed;
      inset: 0;             /* equivale a top:0; right:0; bottom:0; left:0 */
      background: rgba(0,0,0,0.7);
      z-index: 100;
      /* flexbox para centrar el modal en escritorio
         y pegarlo abajo en móvil */
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    /* Cuando el overlay tiene la clase .open se muestra */
    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      /* Solo esquinas superiores redondeadas: efecto "sube desde abajo" */
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      width: 100%;
      max-width: 500px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* ── Formulario ──────────────────────────────────────────────────*/
    .form-group { margin-bottom: 14px; }

    .form-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 14px;
      outline: none;
      padding: 10px 14px;
      transition: border-color 0.15s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
    }

    .form-select option { background: var(--surface); }

    /* Dos columnas en el formulario para importe y fecha */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Botones de acción del formulario ────────────────────────────*/
    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      color: #0d0d0d;
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.85; }

    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 14px;
      padding: 12px 20px;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: var(--border); }

    /* ── Botón flotante de añadir ────────────────────────────────────
       position: fixed lo ancla a la esquina inferior derecha
       sin importar el scroll.
    ──────────────────────────────────────────────────────────────── */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #0d0d0d;
      cursor: pointer;
      font-size: 24px;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(200,241,53,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
      z-index: 50;
    }

    .fab:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 24px rgba(200,241,53,0.4);
    }

    /* ── Responsive: escritorio ───────────────────────────────────────
       @media aplica estilos solo cuando la pantalla es más ancha
       que 600px (escritorio o tablet).
    ──────────────────────────────────────────────────────────────── */
    @media (min-width: 600px) {
      .overlay { align-items: center; }
      .modal   { border-radius: 20px; }
    }

    .mes-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 0 8px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border);
    }

    .mes-nombre {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .mes-total {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--accent);
    }

    .mes-grupo {}

    .mes-header {
        cursor: pointer;  /* el cursor cambia a mano al pasar por encima */
        user-select: none; /* evita que se seleccione el texto al hacer clic */
    }

    .mes-toggle {
        font-size: 11px;
        color: var(--muted);
        transition: transform 0.2s ease;
        display: inline-block;
    }

    /* Cuando el grupo está colapsado, la flecha rota */
    .mes-grupo.colapsado .mes-toggle {
        transform: rotate(-90deg);
    }

    .mes-items {
        overflow: hidden;
        /* max-height grande para la animación de abrir */
        max-height: 2000px;
        transition: max-height 0.3s ease;
    }

    /* Cuando está colapsado, los items desaparecen con animación */
    .mes-grupo.colapsado .mes-items {
        max-height: 0;
    }

    /* Barra de presupuesto dentro de cada cabecera de mes */
    .mes-budget {
        padding: 10px 0 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .mes-budget-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
    }

    .mes-budget-row span:last-child {
        font-family: var(--font-mono);
        font-size: 12px;
    }

    /* El importe restante cambia de color según si hay saldo o no */
    .restante-positivo { color: var(--accent); }
    .restante-negativo { color: var(--danger); }

    /* Barra de progreso del presupuesto */
    .budget-track {
        width: 100%;
        background: var(--bg);
        border-radius: 4px;
        height: 4px;
        overflow: hidden;
    }

    .budget-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.4s ease;
    }

    /* Verde si está por debajo del presupuesto, rojo si lo supera */
    .budget-fill.ok       { background: var(--accent); }
    .budget-fill.excedido { background: var(--danger); }

    /* Botón para editar el presupuesto dentro de la cabecera */
    .btn-presupuesto {
        background: none;
        border: 1px dashed var(--border);
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        font-family: var(--font-main);
        font-size: 11px;
        padding: 4px 10px;
        transition: border-color 0.15s, color 0.15s;
    }

    .btn-presupuesto:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .chart-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .mes-select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: var(--font-main);
        font-size: 13px;
        padding: 7px 12px;

    .fijos-header {

    .overlay-fijo.open { display: flex; }

  </style>
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <header>
    <div class="header-top">
        <div class="logo">EXPENSES MANAGER <span>(by amillana)</span></div>
        <div class="user-box">
            <span id="usuario-actual"></span>
            <button class="btn-salir" id="btn-salir">Salir</button>
        </div>
    </div>
    <!-- Las stats se rellenan desde JavaScript -->
    <div class="stats" id="stats"></div>
  </header>

  <!-- ── Tabs ────────────────────────────────────────────────────── -->

    <!--
      data-tab es un atributo personalizado (data attribute).

    -->
    <button class="tab active" data-tab="lista">Lista</button>
    <button class="tab"        data-tab="graficos">Gráficos</button>
    <button class="tab"        data-tab="fijos">Fijos</button>

  <!-- ── Contenido ───────────────────────────────────────────────── -->
  <main class="content">

    <!-- Vista Lista -->
    <section class="view active" id="view-lista">
      <div class="expense-list" id="expense-list">
        <!-- Los gastos se insertan aquí desde JavaScript -->
      </div>
    </section>

    <!-- Vista Gráficos -->
    <section class="view" id="view-graficos">
        <!-- Evolución de los últimos N meses -->
        <div class="chart-card">
            <div class="chart-controls">
                <div class="chart-title">Evolución</div>
                <div class="seg" id="evo-meses" role="group" aria-label="Número de meses">
                    <button type="button" data-n="3">3m</button>
                    <button type="button" data-n="6">6m</button>
                    <button type="button" data-n="12">12m</button>
                    <button type="button" data-n="24">24m</button>
                </div>
            </div>
            <div class="evo-resumen" id="evo-resumen"></div>
            <!-- La línea discontinua del gráfico marca la media/mes -->
            <div class="cols" id="evo-cols"></div>
            <div class="col-labels" id="evo-labels"></div>
        </div>

        <!-- Categorías del mes elegido comparadas con el mes anterior -->
        <div class="chart-card">
            <div class="chart-controls">

                <select class="mes-select" id="mes-select" onchange="renderCategorias()">
                </select>
            </div>
            <div id="chart-bars"></div>
            <div class="legend">
                <span><i class="l-fill"></i>este mes</span>
                <span><i class="l-prev"></i><span id="leyenda-anterior">mes anterior</span></span>
                <span class="up">▲ gastas más</span>
                <span class="down">▼ gastas menos</span>

        <!-- Categorías a lo largo del periodo elegido -->

                    </thead>

    <!-- Vista Gastos Fijos -->
    <section class="view" id="view-fijos">
      <div class="fijos-header">
        <p class="fijos-desc">Gastos que se repiten cada mes. Pulsa "Empezar mes" para añadirlos automáticamente.</p>
        <button class="btn-empezar-mes" id="btn-empezar-mes">&#9654; Empezar mes</button>
      </div>

  </main>

  <!-- ── Botón flotante ──────────────────────────────────────────── -->
  <button class="fab" id="fab" title="Añadir gasto">+</button>

  <!-- ── Modal con el formulario ─────────────────────────────────── -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-title" id="modal-title">Nuevo gasto</div>

      <div class="form-group">

          <label class="form-label">Fecha</label>

      </div>

      <div class="form-group">
        <label class="form-label">Categoría</label>

          <!-- Las opciones se generan desde JavaScript con la lista CATEGORIAS -->
        </select>

      <div class="form-actions">

  <!-- ── Modal gasto fijo ───────────────────────────────────────── -->
  <div class="overlay-fijo" id="overlay-fijo">
    <div class="modal">
      <div class="modal-title" id="modal-fijo-title">Nuevo gasto fijo</div>
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <input class="form-input" id="ff-desc" type="text" placeholder="Ej: Spotify, Seguro, Hipoteca…">
      </div>
      <div class="form-group">
        <label class="form-label">Importe (€)</label>
        <input class="form-input" id="ff-importe" type="number" min="0.01" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <select class="form-select" id="ff-categoria"></select>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" id="btn-cancelar-fijo">Cancelar</button>
        <button class="btn-primary"   id="btn-guardar-fijo">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // ── Configuración ─────────────────────────────────────────────────
    // La URL base de la API. En local es localhost.
    // Cuando despliegues en Railway/Render cambiará a tu URL pública.
    // El string vacío "" significa "la misma URL desde donde se sirve
    // la página" — así funciona tanto en local como en producción
    // sin cambiar nada.
    const API = "";

    // ── Sesión ────────────────────────────────────────────────────────
    // Si la sesión ha caducado, cualquier llamada a la API devuelve 401:
    // en ese caso mandamos al usuario a la pantalla de login.
    const fetchOriginal = window.fetch.bind(window);
    window.fetch = async (...args) => {
      const res = await fetchOriginal(...args);
      if (res.status === 401) {
        location.href = "/login";
        throw new Error("Sesión caducada");
      }
      return res;
    };

    // ── Escapar HTML ──────────────────────────────────────────────────
    // Todo texto que viene de la base de datos pasa por esc() antes de
    // meterlo con innerHTML. Así un gasto llamado "<img onerror=...>"
    // se ve como texto y no se ejecuta.
    const esc = valor => String(valor)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");

    const CATEGORIAS = [
      "Supermercado", "Transporte", "Ocio", "Salud",
      "Gastos Fijos", "Ropa", "Suministros", "Otros"
    ];

    // Emoji por categoría para los iconos
    const ICONOS = {
      "Supermercado": "🛒",
      "Transporte":   "🚇",
      "Ocio":         "🎮",
      "Salud":        "🏥",
      "Gastos Fijos": "📋",
      "Ropa":         "👗",
      "Suministros":  "⚡",
      "Otros":        "📦",
    };

    // ── Estado de la app ──────────────────────────────────────────────
    // Toda la información que necesita la app en memoria.
    // gastos: la lista actual. editandoId: el id del gasto que
    // se está editando (null si se está creando uno nuevo).
    let gastos = [];
    let editandoId = null;

    // Meses que el usuario ha abierto o cerrado a mano. Así, al recargar
    // la lista tras guardar un gasto, cada mes se queda como estaba.
    // Los meses que no están aquí se muestran colapsados salvo el activo.
    const mesesTocados = new Map(); // mes → true (abierto) / false (cerrado)

    // ── Referencias al DOM ────────────────────────────────────────────
    // document.getElementById busca un elemento HTML por su id.
    // Los guardamos en variables para no buscarlo cada vez.
    const lista       = document.getElementById("expense-list");
    const statsEl     = document.getElementById("stats");
    const overlay     = document.getElementById("overlay");
    const modalTitle  = document.getElementById("modal-title");
    const fDesc       = document.getElementById("f-desc");
    const fImporte    = document.getElementById("f-importe");
    const fFecha      = document.getElementById("f-fecha");
    const fCategoria  = document.getElementById("f-categoria");

    // ── Inicializar el select de categorías ───────────────────────────
    // Generamos las opciones del desplegable desde el array CATEGORIAS.
    // innerHTML permite escribir HTML como string y lo inserta en el elemento.
    CATEGORIAS.forEach(cat => {
      fCategoria.innerHTML += `<option value="${cat}">${cat}</option>`;
    });

    // Fecha de hoy en formato YYYY-MM-DD (hora local, no UTC: si no,
    // entre medianoche y las 2:00 en España saldría el día anterior)
    const ahoraLocal = new Date();
    const hoy = `${ahoraLocal.getFullYear()}-${String(ahoraLocal.getMonth() + 1).padStart(2, "0")}-${String(ahoraLocal.getDate()).padStart(2, "0")}`;
    fFecha.value = hoy;

    // ── Mes activo ────────────────────────────────────────────────────
    // Normalmente es el mes de hoy. Pero si ya se ha pulsado "Empezar mes"
    // (por ejemplo al cobrar a finales de mes), el mes siguiente ya tiene
    // gastos y pasa a ser el mes activo aunque el calendario no haya
    // cambiado todavía. Solo se mira hasta el mes siguiente para que un
    // gasto con una fecha mal puesta muy en el futuro no lo descoloque.
    function mesActivo() {
      const mesHoy = hoy.slice(0, 7);
      const mesSiguiente = sumarMeses(mesHoy, 1);
      return gastos.some(g => g.fecha.startsWith(mesSiguiente)) ? mesSiguiente : mesHoy;
    }

    // Día del mes activo hasta el que se compara con el mes anterior
    // ("hasta el mismo día"). Si el mes activo todavía no ha llegado en el
    // calendario (se ha empezado antes de tiempo), solo lleva su día 1:
    // ahí van los gastos fijos y, por defecto, los gastos nuevos.
    function diaReferencia() {
      return hoy.startsWith(mesActivo()) ? hoy.slice(8, 10) : "01";
    }

    // Último día de un mes "2026-02" → "2026-02-28"
    function ultimoDia(mes) {
      const [anyo, num] = mes.split("-").map(Number);
      return `${mes}-${String(new Date(anyo, num, 0).getDate()).padStart(2, "0")}`;
    }

    // ── Formatear moneda ──────────────────────────────────────────────
    // Intl.NumberFormat es la API nativa del navegador para formatear
    // números según el idioma y moneda. "es-ES" formatea en español.
    const fmt = n => new Intl.NumberFormat("es-ES", {
      style: "currency", currency: "EUR"
    }).format(n);

    const fmt_mes = mes => {
          const [anyo, num] = mes.split("-");
          const nombres = [
              "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
              "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
          ];
          return `${nombres[parseInt(num) - 1]} ${anyo}`;
      };
    // ── Llamadas a la API ─────────────────────────────────────────────
    // fetch() es la función nativa de JavaScript para hacer
    // peticiones HTTP. Devuelve una Promise, por eso usamos
    // async/await — permite escribir código asíncrono como si
    // fuera síncrono, esperando el resultado antes de continuar.

    async function cargarGastos() {
        const res = await fetch(`${API}/gastos`);
        gastos = await res.json();

        // Calculamos qué meses hay y cargamos sus presupuestos en paralelo
        const meses = [...new Set(gastos.map(g => g.fecha.slice(0, 7)))];
        await Promise.all(meses.map(cargarPresupuesto));

        renderLista();
        renderStats();
        renderGraficos();
}

    async function crearGasto(datos) {
      await fetch(`${API}/gastos`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" }, // indicamos que mandamos JSON
        body:    JSON.stringify(datos),                   // convertimos el objeto a string JSON
      });
    }

    async function editarGasto(id, datos) {
      await fetch(`${API}/gastos/${id}`, {
        method:  "PUT",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(datos),
      });
    }

    async function eliminarGasto(id) {
      await fetch(`${API}/gastos/${id}`, { method: "DELETE" });
    }

    // ── Renderizar la lista ───────────────────────────────────────────
    // "Renderizar" significa generar el HTML de la lista y
    // insertarlo en el DOM (la estructura de la página).
    function renderLista() {
      if (gastos.length === 0) {
          lista.innerHTML = `
              <div class="empty">
                  <div class="empty-icon">🧾</div>
                  Sin gastos todavía. Pulsa + para añadir el primero.
              </div>`;
          return;
      }

      // 1. Agrupamos los gastos por mes
      // Creamos un objeto donde cada clave es un mes ("2026-03")
      // y su valor es un array con los gastos de ese mes
      const grupos = {};
      gastos.forEach(g => {
          const mes = g.fecha.slice(0, 7); // "2026-03-21" → "2026-03"
          if (!grupos[mes]) grupos[mes] = [];
          grupos[mes].push(g);
      });

      // 2. Ordenamos los meses de más reciente a más antiguo
      const meses = Object.keys(grupos).sort().reverse();

      // 3. Generamos el HTML de cada grupo.
      // Solo el mes activo sale abierto; el resto, colapsado (salvo que
      // el usuario lo haya abierto o cerrado a mano).
      const activo = mesActivo();

      lista.innerHTML = meses.map(mes => {
      const gastosDelMes = grupos[mes];
      const abierto = mesesTocados.has(mes) ? mesesTocados.get(mes) : mes === activo;
      const totalMes = gastosDelMes.reduce((sum, g) => sum + g.importe, 0);

      const items = gastosDelMes.map(g => `
          <div class="expense-item">
              <div class="expense-icon">${ICONOS[g.categoria] || "📦"}</div>
              <div class="expense-body">
                  <div class="expense-desc">${esc(g.descripcion)}</div>
                  <div class="expense-meta">
                      <span class="expense-cat">${esc(g.categoria)}</span>
                      <span class="expense-date">${esc(g.fecha)}</span>
                  </div>
              </div>
              <div class="expense-amount">${fmt(g.importe)}</div>
              <div class="expense-actions">
                  <button class="icon-btn" onclick="abrirEditar(${g.id})">✏️</button>
                  <button class="icon-btn del" onclick="borrar(${g.id})">🗑️</button>
              </div>
          </div>
      `).join("");

      // Cada grupo tiene un id único basado en el mes
      // para que el toggle sepa qué elemento colapsar
      return `
        <div class="mes-grupo${abierto ? "" : " colapsado"}" id="grupo-${mes}">
            <div class="mes-header" onclick="toggleMes('${mes}')">
                <span class="mes-nombre">${fmt_mes(mes)}</span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span class="mes-total">${fmt(totalMes)}</span>
                    <span class="mes-toggle">▼</span>
                </div>
            </div>
            ${renderBudget(mes, totalMes)}
            <div class="mes-items">
                ${items}
            </div>
        </div>
    `;
  }).join("");
    }

    // ── Utilidades de meses ───────────────────────────────────────────
    // Los meses se manejan como texto "2026-03", igual que en la API.
    const MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun",
                          "jul", "ago", "sep", "oct", "nov", "dic"];
    const mesCorto = mes => MESES_CORTOS[parseInt(mes.slice(5)) - 1];

    // Suma (o resta, con n negativo) meses a un mes: ("2026-01", -1) → "2025-12"
    function sumarMeses(mes, n) {
      const [anyo, num] = mes.split("-").map(Number);
      const d = new Date(anyo, num - 1 + n, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    const sumar = lista => lista.reduce((s, g) => s + g.importe, 0);
    const gastosDelMes = mes => gastos.filter(g => g.fecha.startsWith(mes));

    // Variación en % respecto a un valor anterior.
    // Rojo (▲) si gastas más, verde (▼) si gastas menos.
    function delta(actual, anterior) {
      if (!anterior) return actual ? `<span class="flat">nuevo</span>` : "";
      const pct = (actual - anterior) / anterior * 100;
      if (Math.abs(pct) < 1) return `<span class="flat">= igual</span>`;
      const clase  = pct > 0 ? "up" : "down";
      const flecha = pct > 0 ? "▲" : "▼";
      return `<span class="${clase}">${flecha} ${Math.abs(pct).toFixed(0)}%</span>`;
    }

    // ── Renderizar las estadísticas del header ────────────────────────
    function renderStats() {
      const total = sumar(gastos);

      // Mes actual (el activo, que puede ir por delante del calendario)
      // y anterior en formato "2026-03"
      const mesActual   = mesActivo();
      const mesAnt      = sumarMeses(mesActual, -1);
      const mesAntAnt   = sumarMeses(mesActual, -2);
      const totalMes    = sumar(gastosDelMes(mesActual));
      const totalAnt    = sumar(gastosDelMes(mesAnt));
      const totalAntAnt = sumar(gastosDelMes(mesAntAnt));

      // Para que la comparación sea justa a mitad de mes, "Este mes" se
      // compara con lo gastado el mes anterior hasta el mismo día.
      const diaHoy = diaReferencia();
      const totalAntMismoDia = sumar(
        gastosDelMes(mesAnt).filter(g => g.fecha.slice(8, 10) <= diaHoy)
      );

      statsEl.innerHTML = `
        <div class="stat">
          <div class="stat-label">Total</div>
          <div class="stat-value accent">${fmt(total)}</div>
          <div class="stat-delta flat">${gastos.length} gastos</div>
        </div>
        <div class="stat">
          <div class="stat-label">Este mes</div>
          <div class="stat-value">${fmt(totalMes)}</div>
          <div class="stat-delta" title="Comparado con lo gastado hasta el día ${parseInt(diaHoy)} de ${mesCorto(mesAnt)}">
            ${delta(totalMes, totalAntMismoDia)} <span class="flat">vs ${mesCorto(mesAnt)}</span>
          </div>
        </div>
        <div class="stat">
          <div class="stat-label">Mes anterior</div>
          <div class="stat-value">${fmt(totalAnt)}</div>
          <div class="stat-delta">
            ${delta(totalAnt, totalAntAnt)} <span class="flat">vs ${mesCorto(mesAntAnt)}</span>
          </div>
        </div>
      `;
    }

    // ── Pestaña Gráficos ──────────────────────────────────────────────
    // Número de meses de la evolución. Se recuerda en el navegador.
    let mesesEvolucion = 6;
    try {
      const guardado = parseInt(localStorage.getItem("evolucion-meses"));
      if ([3, 6, 12, 24].includes(guardado)) mesesEvolucion = guardado;
    } catch (e) { /* sin localStorage: usamos 6 */ }

    document.getElementById("evo-meses").addEventListener("click", e => {
      const boton = e.target.closest("button");
      if (!boton) return;
      mesesEvolucion = parseInt(boton.dataset.n);
      try { localStorage.setItem("evolucion-meses", mesesEvolucion); } catch (err) {}
      renderEvolucion();
    });

    function renderGraficos() {
        const select = document.getElementById("mes-select");

        // Calculamos qué meses hay en los gastos para rellenar el selector
        const mesesDisponibles = [...new Set(gastos.map(g => g.fecha.slice(0, 7)))]
            .sort()
            .reverse();

        // Rellenamos el selector solo si los meses han cambiado
        // para no resetear la selección del usuario en cada render
        const opcionesActuales = [...select.options].map(o => o.value);
        const mismaOpciones = JSON.stringify(opcionesActuales) === JSON.stringify(mesesDisponibles);

        if (!mismaOpciones) {
            const anterior = select.value;
            select.innerHTML = mesesDisponibles.map(mes =>
                `<option value="${mes}">${fmt_mes(mes)}</option>`
            ).join("");
            if (mesesDisponibles.includes(anterior)) select.value = anterior;
        }

        renderEvolucion();
        renderCategorias();
    }

    // ── Evolución: una columna por mes de los últimos N meses ─────────
    function renderEvolucion() {
        const n = mesesEvolucion;
        document.querySelectorAll("#evo-meses button").forEach(b =>
            b.classList.toggle("active", parseInt(b.dataset.n) === n)
        );

        // Totales por mes en una sola pasada
        const porMes = {};
        gastos.forEach(g => {
            const mes = g.fecha.slice(0, 7);
            porMes[mes] = (porMes[mes] || 0) + g.importe;
        });

        // Los últimos n meses, terminando en el actual (aunque alguno esté vacío)
        const mesActual = mesActivo();
        const rango   = Array.from({ length: n }, (_, i) => sumarMeses(mesActual, i - n + 1));
        const totales = rango.map(m => porMes[m] || 0);

        // Para la media, el más caro y el más barato solo cuentan los meses
        // ya terminados y desde el primer mes con gastos (si la app lleva
        // poco tiempo en uso, los meses vacíos de antes no bajan la media).
        const primerMes = Object.keys(porMes).sort()[0] || mesActual;
        const cerrados  = rango
            .map((mes, i) => ({ mes, total: totales[i] }))
            .filter(m => m.mes !== mesActual && m.mes >= primerMes);

        const resumen = document.getElementById("evo-resumen");
        if (cerrados.length === 0) {
            resumen.innerHTML = `
                <div><div class="evo-label">Media/mes</div><div class="evo-valor">—</div></div>
                <div><div class="evo-label">Mes más caro</div><div class="evo-valor">—</div></div>
                <div><div class="evo-label">Mes más barato</div><div class="evo-valor">—</div></div>`;
        } else {
            const media  = cerrados.reduce((s, m) => s + m.total, 0) / cerrados.length;
            const caro   = cerrados.reduce((a, b) => b.total > a.total ? b : a);
            const barato = cerrados.reduce((a, b) => b.total < a.total ? b : a);
            resumen.innerHTML = `
                <div><div class="evo-label">Media/mes ┄</div><div class="evo-valor">${fmt(media)}</div></div>
                <div><div class="evo-label">Mes más caro</div><div class="evo-valor">${mesCorto(caro.mes)} · ${fmt(caro.total)}</div></div>
                <div><div class="evo-label">Mes más barato</div><div class="evo-valor">${mesCorto(barato.mes)} · ${fmt(barato.total)}</div></div>`;
            resumen.dataset.media = media;
        }

        // Escala: el mes más alto ocupa ~90% de la altura
        const maximo = Math.max(...totales, 1) * 1.12;
        const corto  = v => v >= 1000
            ? (v / 1000).toLocaleString("es-ES", { maximumFractionDigits: 1 }) + "k"
            : Math.round(v).toString();

        const cols = document.getElementById("evo-cols");
        cols.classList.toggle("dense", n > 6);
        cols.innerHTML = rango.map((mes, i) => {
            const clase = i === n - 1 ? "cur" : i === n - 2 ? "prev" : "";
            const alto  = (totales[i] / maximo * 100).toFixed(1);
            let titulo  = `${fmt_mes(mes)}: ${fmt(totales[i])}`;
            if (i > 0 && totales[i - 1]) {
                const pct = (totales[i] - totales[i - 1]) / totales[i - 1] * 100;
                titulo += ` (${pct > 0 ? "+" : ""}${pct.toFixed(0)}% vs mes anterior)`;
            }
            return `
                <div class="col ${clase}" title="${titulo}">
                    ${totales[i] ? `<div class="col-val" style="bottom:${alto}%">${corto(totales[i])}</div>` : ""}
                    <div class="col-bar" style="height:${alto}%"></div>
                </div>`;
        }).join("") + (cerrados.length
            ? `<div class="media-linea" title="Media" style="bottom:${(resumen.dataset.media / maximo * 100).toFixed(1)}%"></div>`
            : "");

        // Etiquetas: con 24 meses solo enero (con el año) y el mes actual
        const labels = document.getElementById("evo-labels");
        labels.classList.toggle("dense", n > 12);
        labels.innerHTML = rango.map((mes, i) => {
            let texto = mesCorto(mes);
            if (n > 12) {
                texto = mes.endsWith("-01") ? `${mesCorto(mes)} ${mes.slice(2, 4)}`
                      : i === n - 1         ? mesCorto(mes)
                      : "";
            }
            return `<div class="${i === n - 1 ? "cur" : ""}">${texto}</div>`;
        }).join("");

        renderTablaCategorias(rango, cerrados.map(m => m.mes));
    }

    // ── Categorías del mes elegido, con la marca del mes anterior ─────
    function renderCategorias() {
        const mes = document.getElementById("mes-select").value;
        const chartBars = document.getElementById("chart-bars");

        if (!mes) {
            chartBars.innerHTML = `<div class="empty" style="padding:30px 0">Sin gastos en este mes</div>`;
            return;
        }

        const mesAnt = sumarMeses(mes, -1);

        // Si es el mes en curso, se compara con el mes anterior hasta el
        // mismo día (si no, el mes actual siempre parecería más barato).
        const enCurso = mes === mesActivo();
        const diaHoy  = diaReferencia();
        const gastosAnt = gastosDelMes(mesAnt)
            .filter(g => !enCurso || g.fecha.slice(8, 10) <= diaHoy);
        document.getElementById("leyenda-anterior").textContent = enCurso
            ? `${mesCorto(mesAnt)} hasta el día ${parseInt(diaHoy)}`
            : "mes anterior";

        const totales = {};   // totales[cat] = { actual, anterior }
        gastosDelMes(mes).forEach(g => {
            totales[g.categoria] ??= { actual: 0, anterior: 0 };
            totales[g.categoria].actual += g.importe;
        });
        gastosAnt.forEach(g => {
            totales[g.categoria] ??= { actual: 0, anterior: 0 };
            totales[g.categoria].anterior += g.importe;
        });

        const datos = Object.entries(totales)
            .map(([cat, t]) => ({ cat, ...t }))
            .sort((a, b) => b.actual - a.actual || b.anterior - a.anterior);

        if (datos.length === 0) {
            chartBars.innerHTML = `<div class="empty" style="padding:30px 0">Sin gastos en este mes</div>`;
            return;
        }

        const maximo = Math.max(...datos.map(d => Math.max(d.actual, d.anterior)));

        chartBars.innerHTML = datos.map(({ cat, actual, anterior }) => {
            const pct    = (actual / maximo * 100).toFixed(1);
            const pctAnt = (anterior / maximo * 100).toFixed(1);
            return `
                <div class="bar-row" title="${esc(cat)} en ${fmt_mes(mesAnt)}${enCurso ? ` hasta el día ${parseInt(diaHoy)}` : ""}: ${fmt(anterior)}">
                    <div class="bar-label">${ICONOS[cat] || "📦"} ${esc(cat)}</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${pct}%"></div>
                        ${anterior ? `<div class="bar-prev" style="left: calc(${pctAnt}% - 1px)"></div>` : ""}
                    </div>
                    <div class="bar-value">
                        <div>${fmt(actual)}</div>
                        <div class="bar-delta">${delta(actual, anterior)}</div>
                    </div>
                </div>
            `;
        }).join("");
    }

    // ── Tabla: cada categoría a lo largo de los meses elegidos ────────
    function sparkline(valores) {
        const w = 60, h = 22;
        const max = Math.max(...valores), min = Math.min(...valores);
        const puntos = valores.map((v, i) => [
            (i / Math.max(valores.length - 1, 1) * (w - 4) + 2).toFixed(1),
            (h - 3 - (max === min ? 0.5 : (v - min) / (max - min)) * (h - 6)).toFixed(1),
        ]);
        const [ux, uy] = puntos[puntos.length - 1];
        return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">
            <polyline points="${puntos.map(p => p.join(",")).join(" ")}" fill="none"
                stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="${ux}" cy="${uy}" r="2.5" fill="var(--accent)"/>
        </svg>`;
    }

    function renderTablaCategorias(rango, mesesCerrados) {
        document.getElementById("tabla-titulo").textContent =
            `Categorías · últimos ${rango.length} meses`;

        // porCat[cat][mes] = total
        const porCat = {};
        const enRango = new Set(rango);
        gastos.forEach(g => {
            const mes = g.fecha.slice(0, 7);
            if (!enRango.has(mes)) return;
            porCat[g.categoria] ??= {};
            porCat[g.categoria][mes] = (porCat[g.categoria][mes] || 0) + g.importe;
        });

        const filas = Object.entries(porCat).map(([cat, meses]) => {
            const serie = rango.map(m => meses[m] || 0);
            const total = serie.reduce((a, b) => a + b, 0);
            // La media usa solo los meses terminados (como la tarjeta de evolución)
            const media = mesesCerrados.length
                ? mesesCerrados.reduce((s, m) => s + (meses[m] || 0), 0) / mesesCerrados.length
                : total;
            return { cat, serie, total, media };
        }).sort((a, b) => b.total - a.total);

        const tbody = document.getElementById("tabla-cat");
        if (filas.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="flat">Sin gastos en este periodo</td></tr>`;
            return;
        }

        tbody.innerHTML = filas.map(f => `
            <tr>
                <td>${ICONOS[f.cat] || "📦"} ${esc(f.cat)}</td>
                <td class="spark">${sparkline(f.serie)}</td>
                <td class="num">${fmt(f.media)}</td>
                <td class="num">${fmt(f.total)}</td>
            </tr>`).join("");
    }

    // ── Abrir y cerrar el modal ───────────────────────────────────────
    function abrirNuevo() {
      editandoId    = null;
      modalTitle.textContent = "Nuevo gasto";
      fDesc.value   = "";
      fImporte.value = "";
      // Un gasto nuevo va siempre al mes activo. Si el mes activo es el
      // siguiente (ya se ha empezado), la fecha por defecto es su día 1.
      const activo = mesActivo();
      fFecha.min    = `${activo}-01`;
      fFecha.max    = ultimoDia(activo);
      fFecha.value  = hoy.startsWith(activo) ? hoy : `${activo}-01`;
      fCategoria.value = "Supermercado";
      overlay.classList.add("open");  // añadir la clase .open lo hace visible
      fDesc.focus();
    }

    function abrirEditar(id) {
      const g = gastos.find(g => g.id === id);  // busca el gasto por id
      if (!g) return;
      editandoId = id;
      modalTitle.textContent = "Editar gasto";
      // Al editar se puede poner cualquier fecha
      fFecha.removeAttribute("min");
      fFecha.removeAttribute("max");
      fDesc.value      = g.descripcion;
      fImporte.value   = g.importe;
      fFecha.value     = g.fecha;
      fCategoria.value = g.categoria;
      overlay.classList.add("open");
    }

    function cerrarModal() {
      overlay.classList.remove("open");
    }

    function toggleMes(mes) {
    const grupo = document.getElementById(`grupo-${mes}`);
    // classList.toggle añade la clase si no está, la quita si está
    grupo.classList.toggle("colapsado");
    mesesTocados.set(mes, !grupo.classList.contains("colapsado"));
}
    // ── Guardar (crear o editar) ──────────────────────────────────────
    async function guardar() {
      const datos = {
        descripcion: fDesc.value.trim(),
        importe:     parseFloat(fImporte.value),
        categoria:   fCategoria.value,
        fecha:       fFecha.value,
      };

      // Validación mínima en el cliente antes de llamar a la API
      if (!datos.descripcion || isNaN(datos.importe) || datos.importe <= 0) {
        alert("Rellena todos los campos correctamente.");
        return;
      }

      // Los gastos nuevos tienen que ser del mes activo
      if (!editandoId) {
        const activo = mesActivo();
        if (!datos.fecha.startsWith(activo)) {
          alert(`La fecha tiene que ser de ${fmt_mes(activo)}.`);
          return;
        }
      }

      if (editandoId) {
        await editarGasto(editandoId, datos);
      } else {
        await crearGasto(datos);
      }

      cerrarModal();
      await cargarGastos();  // recargamos para reflejar los cambios
    }

    async function borrar(id) {
      // confirm muestra un diálogo de confirmación nativo del navegador
      if (!confirm("¿Eliminar este gasto?")) return;
      await eliminarGasto(id);
      await cargarGastos();
    }

    // Guarda los presupuestos en memoria para no pedir la API en cada render
    const presupuestos = {};

    async function cargarPresupuesto(mes) {
        try {
            const res = await fetch(`${API}/presupuestos/${mes}`);
            if (res.ok) {
                presupuestos[mes] = await res.json();
            } else {
                // Si no tiene presupuesto definido, guardamos null
                presupuestos[mes] = null;
            }
        } catch {
            presupuestos[mes] = null;
        }
    }

    async function definirPresupuesto(mes, nombre) {
        // prompt muestra un diálogo nativo del navegador para pedir un valor
        const valor = prompt(`Presupuesto para ${nombre} (€):`);
        if (!valor) return;

        const importe = parseFloat(valor);
        if (isNaN(importe) || importe <= 0) {
            alert("Introduce un importe válido mayor que 0.");
            return;
        }

        await fetch(`${API}/presupuestos/${mes}`, {
            method:  "PUT",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ importe }),
        });

        // Recargamos el presupuesto del mes y volvemos a renderizar
        await cargarPresupuesto(mes);
        renderLista();
    }

    function renderBudget(mes, gastado) {
        const p = presupuestos[mes];

        // Si no hay presupuesto definido, mostramos el botón para definirlo
        if (!p) {
            return `
                <div class="mes-budget">
                    <button class="btn-presupuesto"
                        onclick="definirPresupuesto('${mes}', '${fmt_mes(mes)}')">
                        + Definir presupuesto
                    </button>
                </div>
            `;
        }

        const pct      = Math.min((gastado / p.importe) * 100, 100);
        const excedido = gastado > p.importe;
        const restante = p.importe - gastado;

        return `
            <div class="mes-budget">
                <div class="mes-budget-row">
                    <span>Presupuesto</span>
                    <span>${fmt(p.importe)}</span>
                </div>
                <div class="mes-budget-row">
                    <span>Restante</span>
                    <span class="${excedido ? "restante-negativo" : "restante-positivo"}">
                        ${excedido ? "-" : ""}${fmt(Math.abs(restante))}
                    </span>
                </div>
                <div class="budget-track">
                    <div class="budget-fill ${excedido ? "excedido" : "ok"}"
                        style="width: ${pct}%"></div>
                </div>
                <button class="btn-presupuesto"
                    onclick="definirPresupuesto('${mes}', '${fmt_mes(mes)}')">
                    ✎ Editar presupuesto
                </button>
            </div>
        `;
    }
    // ── Navegación entre pestañas ─────────────────────────────────────
    // querySelectorAll devuelve todos los elementos que coinciden
    // con el selector CSS ".tab".
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        const vista = tab.dataset.tab;  // lee el atributo data-tab

        // Desactiva todas las tabs y vistas
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));

        // Activa la tab pulsada y su vista correspondiente
        tab.classList.add("active");
        document.getElementById(`view-${vista}`).classList.add("active");
      });
    });

    // ── Event listeners ───────────────────────────────────────────────
    // addEventListener escucha eventos (clicks, teclado, etc.)
    // y llama a una función cuando ocurren.
    document.getElementById("fab").addEventListener("click", abrirNuevo);
    document.getElementById("btn-cancelar").addEventListener("click", cerrarModal);
    document.getElementById("btn-guardar").addEventListener("click", guardar);

    // Cerrar el modal al pulsar fuera (en el overlay oscuro)
    overlay.addEventListener("click", e => {
      if (e.target === overlay) cerrarModal();
    });

    // ── Gastos fijos ──────────────────────────────────────────────────
    let gastosFijos = [];
    let editandoFijoId = null;

    const overlayFijo  = document.getElementById("overlay-fijo");
    const ffDesc       = document.getElementById("ff-desc");
    const ffImporte    = document.getElementById("ff-importe");
    const ffCategoria  = document.getElementById("ff-categoria");

    // Rellena el select de categorías del modal de fijos
    CATEGORIAS.forEach(cat => {
        ffCategoria.innerHTML += `<option value="${cat}">${cat}</option>`;
    });

    async function cargarGastosFijos() {
        const res = await fetch(`${API}/gastos-fijos`);
        gastosFijos = await res.json();
        renderFijos();
    }

    function renderFijos() {
        const lista = document.getElementById("fijos-list");
        if (gastosFijos.length === 0) {
            lista.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📋</div>
                    Sin gastos fijos. Pulsa "Añadir gasto fijo" para empezar.
                </div>`;
            return;
        }
        lista.innerHTML = gastosFijos.map(g => `
            <div class="expense-item">
                <div class="expense-icon">${ICONOS[g.categoria] || "📦"}</div>
                <div class="expense-body">
                    <div class="expense-desc">${esc(g.descripcion)}</div>
                    <div class="expense-meta">
                        <span class="expense-cat">${esc(g.categoria)}</span>
                    </div>
                </div>
                <div class="expense-amount">${fmt(g.importe)}</div>
                <div class="expense-actions">
                    <button class="icon-btn" onclick="abrirEditarFijo(${g.id})">✏️</button>
                    <button class="icon-btn del" onclick="borrarFijo(${g.id})">🗑️</button>
                </div>
            </div>
        `).join("");
    }

    function abrirNuevoFijo() {
        editandoFijoId = null;
        document.getElementById("modal-fijo-title").textContent = "Nuevo gasto fijo";
        ffDesc.value = "";
        ffImporte.value = "";
        ffCategoria.value = "Gastos Fijos";
        overlayFijo.classList.add("open");
        ffDesc.focus();
    }

    function abrirEditarFijo(id) {
        const g = gastosFijos.find(g => g.id === id);
        if (!g) return;
        editandoFijoId = id;
        document.getElementById("modal-fijo-title").textContent = "Editar gasto fijo";
        ffDesc.value      = g.descripcion;
        ffImporte.value   = g.importe;
        ffCategoria.value = g.categoria;
        overlayFijo.classList.add("open");
    }

    function cerrarModalFijo() {
        overlayFijo.classList.remove("open");
    }

    async function guardarFijo() {
        const datos = {
            descripcion: ffDesc.value.trim(),
            importe:     parseFloat(ffImporte.value),
            categoria:   ffCategoria.value,
        };
        if (!datos.descripcion || isNaN(datos.importe) || datos.importe <= 0) {
            alert("Rellena todos los campos correctamente.");
            return;
        }
        if (editandoFijoId) {
            await fetch(`${API}/gastos-fijos/${editandoFijoId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos),
            });
        } else {
            await fetch(`${API}/gastos-fijos`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos),
            });
        }
        cerrarModalFijo();
        await cargarGastosFijos();
    }

    async function borrarFijo(id) {
        if (!confirm("¿Eliminar este gasto fijo?")) return;
        await fetch(`${API}/gastos-fijos/${id}`, { method: "DELETE" });
        await cargarGastosFijos();
    }

    async function empezarMes() {
        // Calculamos el mes siguiente al actual
        const ahora  = new Date();
        const anyo   = ahora.getMonth() === 11 ? ahora.getFullYear() + 1 : ahora.getFullYear();
        const mes    = ahora.getMonth() === 11 ? 1 : ahora.getMonth() + 2;
        const mesFmt = `${anyo}-${String(mes).padStart(2, "0")}`;

        const confirmado = confirm(`¿Añadir ${gastosFijos.length} gastos fijos al mes ${fmt_mes(mesFmt)}?`);
        if (!confirmado) return;

        const res  = await fetch(`${API}/empezar-mes`, {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ mes: mesFmt }),
        });
        if (!res.ok) {
            alert("No se ha podido empezar el mes. Inténtalo de nuevo.");
            return;
        }
        const data = await res.json();
        let msg = `Se han añadido ${data.insertados} gastos a ${fmt_mes(mesFmt)}.`;
        if (data.omitidos > 0) {
            msg += `\n${data.omitidos} ya estaban añadidos y no se han duplicado.`;
        }
        alert(msg);
        await cargarGastos();
    }

    document.getElementById("btn-add-fijo").addEventListener("click", abrirNuevoFijo);
    document.getElementById("btn-cancelar-fijo").addEventListener("click", cerrarModalFijo);
    document.getElementById("btn-guardar-fijo").addEventListener("click", guardarFijo);
    document.getElementById("btn-empezar-mes").addEventListener("click", empezarMes);

    overlayFijo.addEventListener("click", e => {
        if (e.target === overlayFijo) cerrarModalFijo();
    });

    // ── Arranque ──────────────────────────────────────────────────────
    // Cargamos los gastos al abrir la página por primera vez.
    cargarGastos();
    cargarGastosFijos();

    fetch(`${API}/yo`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("usuario-actual").textContent = data.usuario;
      })
      .catch(() => {});

    document.getElementById("btn-salir").addEventListener("click", async () => {
      await fetch(`${API}/logout`, { method: "POST" });
      // Borramos la caché del service worker para no dejar datos en el móvil
      if ("caches" in window) {
        const claves = await caches.keys();
        await Promise.all(claves.map(k => caches.delete(k)));
      }
      location.href = "/login";
    });

// Registra el service worker si el navegador lo soporta
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/sw.js", { scope: "/" })
            .then(() => console.log("Service Worker registrado"))
            .catch(err => console.log("Error SW:", err));
    }

  </script>
